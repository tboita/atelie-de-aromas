<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ateliê de Aromas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: faixa magenta da marca no topo com abas; abaixo, papel com cartões retos. Círculo em duas colunas no desktop, empilhado no celular. */
:root{
  --band:#8E1A54; --band-ink:#F8F3F1; --vela:#F2C14E; --vivo:#C7366F;
  --bg:#F8F3F1; --fg:#4A0E2E; --muted:#6E3A55; --card:#FFFFFF; --line:#E6D4DC; --soft:#F1DCE6;
  --accent:#8E1A54; --accent-ink:#F8F3F1; --ok:#2F6B4A; --warn:#8A5200; --bad:#A3243A;
  --f0:#F4DE8A; --f1:#BFE0E2; --f2:#CFE3B8; --f3:#D8DAF0; --f4:#D9BC98; --f5:#C9AEA4; --f6:#F0B99A; --f7:#F2D7A6; --f8:#F1C6DA; --f9:#F6B7A8; --seg-ink:#4A0E2E;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C0913; --fg:#F3E6EC; --muted:#C9A6B8; --card:#290F1E; --line:#4A2236; --soft:#3A1529;
  --accent:#E0679A; --accent-ink:#1C0913; --ok:#86CFA5; --warn:#EDBA62; --bad:#F38C9C;
  --f0:#6B5A1C; --f1:#2C5A5E; --f2:#43602D; --f3:#474B78; --f4:#62482E; --f5:#5A3F37; --f6:#7A4430; --f7:#6E5426; --f8:#74304F; --f9:#7A3A30; --seg-ink:#F8F3F1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C0913; --fg:#F3E6EC; --muted:#C9A6B8; --card:#290F1E; --line:#4A2236; --soft:#3A1529;
  --accent:#E0679A; --accent-ink:#1C0913; --ok:#86CFA5; --warn:#EDBA62; --bad:#F38C9C;
  --f0:#6B5A1C; --f1:#2C5A5E; --f2:#43602D; --f3:#474B78; --f4:#62482E; --f5:#5A3F37; --f6:#7A4430; --f7:#6E5426; --f8:#74304F; --f9:#7A3A30; --seg-ink:#F8F3F1; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--band);color:var(--band-ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#8E1A54;z-index:16}
header .wrap{padding-block:22px 0}
.sig{display:flex;flex-direction:column;gap:0}
.sig small{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--vela)}
.sig h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,5vw,42px);margin:0;line-height:1.05;text-wrap:balance}
.sig p{margin:6px 0 0;color:#EBC9D9;font-size:14px;max-width:60ch}
nav{display:flex;gap:2px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
nav button{all:unset;cursor:pointer;padding:10px 16px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#EBC9D9;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current="page"]{color:var(--band-ink);border-color:var(--vela)}
nav button:focus-visible{outline:2px solid var(--vela);outline-offset:-2px}
main .wrap{padding-block:24px 64px}
h2{font-family:var(--display);font-weight:500;font-size:28px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:21px;margin:0;line-height:1.15;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 18px;max-width:68ch}
.card{background:var(--card);border:1px solid var(--line);padding:16px}
.btn{font:500 13px var(--sans);letter-spacing:.04em;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;cursor:pointer;border-radius:0}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:4px 10px;font-size:12px}
.btn:focus-visible,.chip:focus-visible,.pill:focus-visible{outline:2px solid var(--vivo);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:7px 9px;border-radius:0;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 13px var(--sans);border:1px solid var(--line);background:var(--card);color:var(--fg);padding:5px 11px;cursor:pointer;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip .n{font-size:11px;opacity:.75}
.pill{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.st-ideia{color:var(--muted)} .st-a-testar{color:var(--accent)} .st-refazer{color:var(--bad)} .st-aprovada{color:var(--ok)}
.warn{color:var(--warn);font-size:12px}
.tag-miss{color:var(--bad);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tag-ok{color:var(--ok);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

/* Círculo */
.circ{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.circ{grid-template-columns:minmax(0,1fr)}}
.wheel svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.wheel path.seg{cursor:pointer;stroke:var(--bg);stroke-width:2;transition:opacity .15s}
.wheel path.seg:hover{opacity:.85}
.wheel text{pointer-events:none}
.famnotes{margin-top:14px}
.panel{display:flex;flex-direction:column;gap:18px;min-width:0}
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.prop{background:var(--card);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.prop[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prop p{margin:0;font-size:13px;color:var(--muted)}
.layers{display:flex;flex-direction:column;gap:6px}
.lay{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:baseline;font-size:14px}
.lay b{font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lay .dose{display:block;font-size:12.5px;color:var(--muted)}
.bar{display:flex;height:8px;width:100%;overflow:hidden;background:var(--soft)}
.bar span{display:block;height:100%}
.rules{font-size:13px;color:var(--muted)}
.rules summary{cursor:pointer;color:var(--fg)}
.rules ul{margin:8px 0 0;padding-left:18px}

/* Receitas */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:16px;min-width:0}
.rc .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.rc .meta{font-size:12px;color:var(--muted)}
.rc details{font-size:13px}
.rc details summary{cursor:pointer;color:var(--accent)}
.rc .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.rc select.status{font-size:12px;padding:3px 6px}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:18px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:500;line-height:1}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Listas */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li .nm{font-weight:500}
.li .sub{font-size:12px;color:var(--muted)}
.li .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.li input.qtd{width:110px}
.group{margin-bottom:28px}
.group h3{margin-bottom:8px}
.sit{cursor:pointer;background:none}
.sit-tenho{color:var(--ok)} .sit-acabando{color:var(--warn)} .sit-acabou{color:var(--bad)}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:22px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
@media (max-width:860px){.cols2{grid-template-columns:minmax(0,1fr)}}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--accent)}
.dots i.on{background:var(--accent)}

/* Editor */
.ov{position:fixed;inset:0;background:rgba(28,9,19,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;z-index:20;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.ed{background:var(--bg);border:1px solid var(--line);width:min(720px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.ed .g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.edl{border-top:1px solid var(--line);padding-top:10px}
.edl .r{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:6px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted)}
nav svg{width:20px;height:20px;display:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.big{padding:12px 18px;font-size:15px}

/* Bancada: tela de preparo */
.bq{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bq .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bq .hd{display:flex;justify-content:space-between;align-items:start;gap:12px}
.bq h2{font-size:clamp(30px,8vw,40px);line-height:1.05}
.bq .sec{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.tick{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:18px}
.tick .bx{width:26px;height:26px;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:16px}
.tick[aria-checked="true"] .bx{background:var(--accent)}
.tick[aria-checked="true"] .tx{opacity:.5;text-decoration:line-through}
.tick .tx small{display:block;font-size:14px;color:var(--muted)}
.tick .temp{font-family:var(--display);font-size:24px;font-weight:600;color:var(--accent);white-space:nowrap}
.tick .lay{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block}
.tick .g{font-family:var(--display);font-size:26px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

@media (max-width:720px){
  body{font-size:16px}
  header .wrap{padding-block:14px 12px}
  .sig small{font-size:10px}
  .sig h1{font-size:28px}
  .sig p{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;background:var(--band);justify-content:space-around;gap:0;
      padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -1px 0 rgba(0,0,0,.15)}
  nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;font-size:10px;letter-spacing:.06em;border-bottom:0;border-top:3px solid transparent;min-width:0}
  nav button[aria-current="page"]{border-color:var(--vela)}
  nav svg{display:block}
  nav .lg{display:none}
  main .wrap{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .chip{padding:9px 14px;font-size:14px;min-height:40px}
  .btn{padding:11px 16px;font-size:14px;min-height:44px}
  .btn.small{padding:9px 12px;font-size:13px;min-height:40px}
  input,select,textarea{font-size:16px;padding:10px}
  .li input.qtd{width:96px}
  .li{grid-template-columns:minmax(0,1fr)}
  .li .ctl{justify-content:flex-start}
  .grid{grid-template-columns:minmax(0,1fr)}
  .stats{gap:16px}
  .stat b{font-size:26px}
  h2{font-size:25px}
  .ov{padding:0}
  .ed{min-height:100%;border:0;padding:max(18px,env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
  .edl .r{grid-template-columns:minmax(0,1fr) 80px 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <div class="sig">
      <small>Velas da Memória</small>
      <h1>Ateliê de Aromas</h1>
      <p>Círculo de aromas, receitas, estoque e compras num lugar só. Toda fórmula com topo, coração e fundo.</p>
    </div>
    <nav id="nav" aria-label="Seções">
      <button data-tab="circulo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v5.5M12 15.5V21M3 12h5.5M15.5 12H21"/></svg>Círculo</button>
      <button data-tab="receitas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l3 3v15H6z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>Receitas</button>
      <button data-tab="estoque"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v4l-4 5v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8l-4-5V3"/><path d="M6 14h12"/></svg>Estoque</button>
      <button data-tab="compras"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.5 12h-11z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Compras</button>
      <button data-tab="diario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2 3 4 4.5 4 8a4 4 0 0 1-8 0c0-2 1-3 1.5-4 .5 1.5 1.5 2 2.5 2 0-2-.5-4 0-6z"/><path d="M8 21h8"/></svg>Diário<span class="lg">&nbsp;de testes</span></button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>
<datalist id="notas-list"></datalist>

<script>
/* ---------- Conhecimento: famílias e notas ---------- */
const FAM=[
 {n:'Cítrico',d:'Abre a vela: limão, bergamota, capim-limão. Evapora rápido.'},
 {n:'Marinho',d:'Ar de mar e brisa. Pede madeira no fundo.'},
 {n:'Verde e chá',d:'Chás, folhas, bambu. Ponte entre fresco e floral.'},
 {n:'Herbal',d:'Lavanda, alecrim, ervas de benzedeira.'},
 {n:'Amadeirado',d:'Madeiras: fundo estável que segura o topo.'},
 {n:'Resinoso',d:'Resinas, couro, patchouli. Fortes: perto de 15%.'},
 {n:'Especiado',d:'Cravo, canela, pimenta rosa. Aquecem a fórmula.'},
 {n:'Gourmand',d:'Baunilha, mel, chocolate, café. Doces e fixadores.'},
 {n:'Floral',d:'Flor de laranjeira, ylang ylang, rosa, jasmim.'},
 {n:'Frutal',d:'Caju, maracujá, pitanga, figo, maçã.'}
];
// [nome, família, camadas possíveis (t,c,f), forte, apelidos]
const NOTES_RAW=[
 ['Bergamota',0,'t'],['Limão',0,'t',0,['limao siciliano']],['Laranja',0,'t',0,['laranja doce']],['Capim-limão',0,'t',0,['capim limao','lemongrass']],['Mexerica',0,'t',0,['tangerina']],
 ['Marina',1,'tc'],['Ocean',1,'t',0,['oceano']],['Mar e Sal',1,'tc'],
 ['Bamboo e Chá Branco',2,'tc',0,['bamboo','cha branco']],['Chá verde',2,'t'],['Chá preto',2,'tc',0,['cha preto suave']],['Cascas e Folhas',2,'c'],['Erva-mate',2,'c',0,['mate']],
 ['Alecrim',3,'t',0,['alecrim ll']],['Lavanda',3,'tc',0,['lavanda francesa','alfazema']],['Erva-doce',3,'tc'],['Sálvia',3,'t'],['Eucalipto',3,'t'],['Erva-cidreira',3,'tc'],['Zimbro',3,'t'],
 ['Madeira',4,'f'],['Cedro',4,'f'],['Sândalo',4,'f'],['Carvalho',4,'f'],['Palo Santo',4,'cf'],['Vetiver',4,'f',1],
 ['Patchouli',5,'f',1],['Âmbar',5,'f'],['Almíscar',5,'f'],['Benjoim',5,'f'],['Couro',5,'cf'],['Madeira defumada',5,'cf'],['Priprioca',5,'cf'],['Mirra',5,'f'],['Olíbano',5,'cf'],
 ['Cravo',6,'tc',0,['cravo flor']],['Canela',6,'tc'],['Pimenta rosa',6,'tc',0,['aroeira']],['Cardamomo',6,'t'],['Gengibre',6,'t'],
 ['Baunilha',7,'f'],['Mel',7,'f'],['Chocolate',7,'cf'],['Café torrado',7,'tc'],['Cappuccino',7,'tc'],
 ['Flor de laranjeira',8,'tc'],['Ylang Ylang',8,'c'],['Jasmim',8,'c',0,['jasmim sambac']],['Rosa',8,'c'],['Gerânio',8,'c'],['Flor de figo',8,'c'],
 ['Maçã com Canela',9,'t'],['Caju',9,'t'],['Maracujá',9,'t'],['Pitanga Preta',9,'t',0,['pitanga']],['Figo',9,'tc'],['Pequi',9,'c']
];
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)/g,' ')
 .replace(/\bessencia( de)?\b/g,' ').replace(/\b(para vela|de vela|cosmetica|lipossoluvel|hidro plus|hidrossoluvel|francesa|ll|oleo essencial)\b/g,' ')
 .replace(/-/g,' ').replace(/\s+/g,' ').trim();
const NOTES=NOTES_RAW.map(([nome,f,c,forte,al])=>({nome,f,c:c.split(''),forte:!!forte,al:al||[]}));
const IDX={}; NOTES.forEach(n=>{IDX[norm(n.nome)]=n; n.al.forEach(a=>IDX[norm(a)]=n)});
const memo=new Map();
function noteFor(name){const k=norm(name); if(!k)return null; if(memo.has(k))return memo.get(k);
 let r=IDX[k]||null; if(!r){let bl=0; for(const a in IDX){if((' '+k+' ').includes(' '+a+' ')&&a.length>bl){r=IDX[a];bl=a.length}}}
 memo.set(k,r); return r;}
const keyOf=name=>{const n=noteFor(name);return n?n.nome:norm(name)};
const famColor=f=>`var(--f${f})`;

/* ---------- Produtos ---------- */
const PROD={
 vela:{n:'Vela',base:110,dose:9.1,lb:'Cera (g)',un:'g',tipos:['vela'],tipoNome:'Essência para vela',
   prep:'Banho-maria: cera de 60 a 70 °C. Fora do fogo, essência a 60 °C; mexer 2 min; despejar de 55 a 60 °C. Endurecer 24 h e curar 7 dias antes de avaliar.',lim:10},
 sabonete:{n:'Sabonete em barra',base:270,dose:3,lb:'Massa da receita (g)',un:'g',tipos:['cosmetica','oleo'],tipoNome:'Essência cosmética',
   prep:'Banho-maria sem ferver: derreter a base, juntar manteiga e babaçu. Fora do fogo, essência a 65 °C; a base não volta ao fogo. Despejar e borrifar álcool. Fazer 2 ou 3 barras por vez.',lim:3},
 manteiga:{n:'Manteiga corporal',base:50,dose:1,lb:'Pote (g)',un:'g',tipos:['cosmetica','oleo'],tipoNome:'Essência cosmética',
   prep:'Banho-maria baixo: derreter manteiga e babaçu. Gelar até ficar opaca e firme por cima; juntar polvilho e essência; bater 3 a 5 min. Teste de toque após 24 h.'},
 liquido:{n:'Sabonete líquido',base:250,dose:.5,lb:'Base (ml)',un:'ml',tipos:['hidro'],tipoNome:'Essência hidrossolúvel',
   prep:'Temperatura ambiente, sem aquecer. Mexer sem bater; descansar 24 h.'},
 cabelo:{n:'Shampoo e condicionador',base:100,dose:1,lb:'Barra (g)',un:'g',tipos:['oleo'],tipoNome:'Óleo essencial',
   prep:'Shampoo: derreter a cerca de 70 °C; óleos essenciais a cerca de 45 °C. Condicionador: derreter a cerca de 80 °C (o BTMS precisa); óleos a cerca de 50 °C.'}
};
const STATUS={ideia:'A criar','a-testar':'A testar',refazer:'Refazer',aprovada:'Aprovada'};
const TIPOS={vela:'Essência para vela',cosmetica:'Essência cosmética',hidro:'Essência hidrossolúvel',oleo:'Óleo essencial',insumo:'Insumo e embalagem'};
const LAYN={t:'Topo',c:'Coração',f:'Fundo'};

/* ---------- Estado ---------- */
const S={db:null,ok:false,receitas:[],estoque:[],compras:[],diario:[],loaded:{},stale:false,
 tab:'circulo',seed:'Flor de laranjeira',seedLayer:null,produto:'vela',base:110,dose:9.1,variant:0,fam:8,prop:0,
 fSt:'todas',fPr:'todos',busca:'',escala:{},confirm:null,diarioPre:null,edit:null};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('pt-BR',{maximumFractionDigits:2});
const r1=n=>Math.round(n*10)/10;
function dose(g,un){const u=un==='ml'?'ml':'g';let s=u==='g'?`${fmt(g)} g · ${fmt(g)} ml`:`${fmt(g)} ml`;if(g>0&&g<=1.5)s+=` · ${Math.round(g*20)} gotas`;return s}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

function emEstoque(nome,produto){const k=keyOf(nome);const tipos=(PROD[produto]||PROD.vela).tipos;
 return S.estoque.some(i=>i.situacao!=='acabou'&&tipos.includes(i.tipo)&&keyOf(i.nome)===k)}
function camadasDe(r){const c=r.camadas||{};return ['t','c','f'].map(l=>[l,(c[l]||[]).filter(x=>x&&x[0])])}
function somaCamada(r,l){return ((r.camadas||{})[l]||[]).reduce((a,x)=>a+(+x[1]||0),0)}
function checar(r){const w=[];const t=somaCamada(r,'t'),c=somaCamada(r,'c'),f=somaCamada(r,'f');
 const n=['t','c','f'].reduce((a,l)=>a+((r.camadas||{})[l]||[]).length,0);
 if(!n){w.push('Sem fórmula ainda');return w}
 if(n===1)w.push('Aroma único: precisa de topo, coração e fundo');
 if(!t)w.push('Sem topo');if(!f)w.push('Sem fundo');
 if(t&&(t<c||t<f))w.push('O topo não é a camada de maior peso');
 return w}
function faltantes(r){if(r.estudo)return[];const out=[];camadasDe(r).forEach(([l,xs])=>xs.forEach(x=>{if(!emEstoque(x[0],r.produto))out.push(x[0])}));return out}

/* ---------- Gerador do círculo ---------- */
const PLANOS=[
 {nome:'Harmonia',desc:'Famílias vizinhas no círculo: transição suave entre as camadas.',offs:[[0,1,-1,2,-2],[-1,1,0,-2,2]]},
 {nome:'Contraste',desc:'Uma camada vem da família oposta: mais personalidade.',offs:[[5,4,-4,6],[1,-1,0,2,-2]]},
 {nome:'Tríade',desc:'Três famílias equidistantes no círculo.',offs:[[3,4,-3],[-3,-4,3,4]]},
 {nome:'Só com o que tenho',desc:'Usa apenas essências do estoque para este produto.',offs:[[0,1,-1,2,-2,3,-3,4,-4,5],[1,-1,0,2,-2,3,-3,4,-4,5]],only:true}
];
function seedLayerOf(seed){return S.seedLayer&&seed.c.includes(S.seedLayer)?S.seedLayer:seed.c[0]}
function gerar(){
 const seed=noteFor(S.seed);if(!seed)return[];
 const lay=seedLayerOf(seed);const others=['t','c','f'].filter(l=>l!==lay);
 return PLANOS.map((p,pi)=>{
  const used=new Set([seed.nome]);const cam={[lay]:seed};let falta=false;
  others.forEach((l,i)=>{
   let cands=[];p.offs[i].forEach(o=>{const fam=((seed.f+o)%10+10)%10;
    NOTES.filter(n=>n.f===fam&&n.c.includes(l)&&!used.has(n.nome))
     .sort((a,b)=>(emEstoque(b.nome,S.produto)-emEstoque(a.nome,S.produto))||(a.forte-b.forte))
     .forEach(n=>{if(!cands.includes(n))cands.push(n)})});
   if(p.only)cands=cands.filter(n=>emEstoque(n.nome,S.produto));
   if(!cands.length){falta=true;return}
   const pick=cands[(S.variant+i+pi)%Math.min(cands.length,4)];cam[l]=pick;used.add(pick.nome)});
  const forte=cam.f&&cam.f.forte;const w=forte?{t:45,c:40,f:15}:{t:40,c:35,f:25};
  const total=r1(S.base*S.dose/100);const g={t:r1(total*w.t/100),c:r1(total*w.c/100)};g.f=r1(total-g.t-g.c);
  return {...p,cam,w,g,total,falta,lay}});
}

/* ---------- Banco de dados ---------- */
async function salvar(fn,okMsg){if(!S.db){toast('Os dados não estão disponíveis nesta visualização.');return false}
 try{await fn();if(okMsg)toast(okMsg);return true}catch(e){toast(e&&e.code==='quota_exceeded'?'O banco está cheio: apague itens antigos.':'Não foi possível salvar. Tente de novo.');return false}}
const col=n=>S.db.collection(n);
const hoje=()=>new Date().toISOString().slice(0,10);

/* ---------- Render ---------- */
function render(){
 const a=document.activeElement;const id=a&&a.id;const sel=a&&'selectionStart' in a?[a.selectionStart,a.selectionEnd]:null;
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
 const app=document.getElementById('app');
 app.innerHTML=({circulo:vCirculo,receitas:vReceitas,estoque:vEstoque,compras:vCompras,diario:vDiario}[S.tab]||vCirculo)();
 if(id){const e=document.getElementById(id);if(e){e.focus();if(sel&&e.setSelectionRange)try{e.setSelectionRange(sel[0],sel[1])}catch(_){}}}
}
function aviso(){return '';
 if(!S.db&&S.ok===false&&S.tried)return `<p class="note">Os dados salvos não abrem nesta visualização. O círculo funciona; receitas, estoque e compras aparecem quando o app é aberto pelo link do Claude.</p>`;
 if(S.stale)return `<p class="note">Ainda carregando os dados salvos; o que aparece pode estar desatualizado.</p>`;return ''}

function wheelSVG(props){
 const cx=210,cy=210,R1=92,R2=196,Rl=146;const a0=-90-18;const P=(r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
 const seed=noteFor(S.seed);const cur=props[S.prop]||props[0];const fams={};
 if(cur)Object.entries(cur.cam).forEach(([l,n])=>{fams[n.f]=(fams[n.f]||'')+l.toUpperCase()});
 let s=`<svg viewBox="0 0 420 420" role="img" aria-label="Círculo de aromas com dez famílias">`;
 FAM.forEach((F,i)=>{const s0=a0+i*36,s1=s0+36;const[x1,y1]=P(R2,s0),[x2,y2]=P(R2,s1),[x3,y3]=P(R1,s1),[x4,y4]=P(R1,s0);
  const on=fams[i]!==undefined;
  s+=`<path class="seg" data-fam="${i}" d="M${x1},${y1}A${R2},${R2} 0 0 1 ${x2},${y2}L${x3},${y3}A${R1},${R1} 0 0 0 ${x4},${y4}Z" fill="${famColor(i)}" ${on?'stroke="var(--accent)" stroke-width="4"':''} ${S.fam===i?'opacity=".92"':''}><title>${esc(F.n)}: ${esc(F.d)}</title></path>`;
  const[lx,ly]=P(Rl,s0+18);
  s+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-family="Jost,sans-serif" font-size="12.5" font-weight="${S.fam===i?600:500}" fill="var(--seg-ink)">${esc(F.n)}</text>`;
  if(on){const[bx,by]=P(R2-18,s0+18);s+=`<text x="${bx}" y="${by}" text-anchor="middle" dominant-baseline="middle" font-family="Jost,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="var(--seg-ink)">${fams[i].split('').join('·')}</text>`}
 });
 s+=`<circle cx="${cx}" cy="${cy}" r="${R1-6}" fill="var(--card)" stroke="var(--line)"/>`;
 if(seed){s+=`<text x="${cx}" y="${cy-14}" text-anchor="middle" font-family="Jost,sans-serif" font-size="10" letter-spacing="2" fill="var(--muted)">${LAYN[seedLayerOf(seed)].toUpperCase()}</text>`;
  const words=seed.nome.split(' ');const lines=words.length>2?[words.slice(0,Math.ceil(words.length/2)).join(' '),words.slice(Math.ceil(words.length/2)).join(' ')]:[seed.nome];
  lines.forEach((t,i)=>s+=`<text x="${cx}" y="${cy+8+i*20}" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="${lines.length>1?19:21}" font-weight="600" fill="var(--fg)">${esc(t)}</text>`)}
 return s+'</svg>'}

function vCirculo(){
 const seed=noteFor(S.seed)||NOTES[0];const props=gerar();const P=PROD[S.produto];
 const famNotes=NOTES.filter(n=>n.f===S.fam);
 const usam=S.receitas.filter(r=>camadasDe(r).some(([l,xs])=>xs.some(x=>keyOf(x[0])===seed.nome)));
 return `${aviso()}<div class="circ">
 <section class="wheel">
  ${wheelSVG(props)}
  <div class="famnotes">
   <div class="eyebrow">${esc(FAM[S.fam].n)}</div>
   <p class="note" style="margin:2px 0 8px">${esc(FAM[S.fam].d)} Toque numa fatia do círculo para ver outra família.</p>
   <div class="chips">${famNotes.map(n=>`<button class="chip" data-act="seed" data-v="${esc(n.nome)}" aria-pressed="${n.nome===seed.nome}">${emEstoque(n.nome,S.produto)?'<span class="dot" title="Em estoque"></span>':''}${esc(n.nome)}</button>`).join('')}</div>
   <p class="note" style="margin-top:8px"><span class="dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok)"></span> em estoque para ${esc(P.n.toLowerCase())}</p>
  </div>
 </section>
 <section class="panel">
  <div>
   <h2>Comece por uma essência</h2>
   <p class="lead" style="margin-bottom:10px">Escolha a essência e o produto. O círculo projeta quatro fórmulas em pirâmide, com as doses já calculadas.</p>
   <div class="row">
    <label class="f" style="flex:1 1 200px">Essência
     <input id="in-seed" list="notas-list" value="${esc(S.seed)}" autocomplete="off"></label>
    <label class="f">Camada da essência
     <select id="in-layer">${seed.c.map(l=>`<option value="${l}" ${seedLayerOf(seed)===l?'selected':''}>${LAYN[l]}</option>`).join('')}</select></label>
   </div>
  </div>
  <div class="row">
   <div class="chips" role="group" aria-label="Produto">${Object.entries(PROD).filter(([k])=>k!=='cabelo').map(([k,p])=>`<button class="chip" data-act="prod" data-v="${k}" aria-pressed="${S.produto===k}">${p.n}</button>`).join('')}</div>
  </div>
  <div class="row">
   <label class="f">${P.lb}<input id="in-base" type="number" inputmode="decimal" min="1" step="1" value="${S.base}" style="width:120px"></label>
   <label class="f">Dose de essência (%)<input id="in-dose" type="number" inputmode="decimal" min="0.1" step="0.1" value="${S.dose}" style="width:110px"></label>
   <div class="note num" style="padding-bottom:8px">Total: <b>${dose(r1(S.base*S.dose/100),P.un)}</b>${P.lim&&S.dose>P.lim?` <span class="warn">acima do limite (${fmt(P.lim)}%)</span>`:''}</div>
  </div>
  <div class="props">${props.map((p,i)=>propCard(p,i,P)).join('')}</div>
  <div class="row"><button class="btn ghost" data-act="variar">Outras combinações</button></div>
  <details class="rules"><summary>Regras do ateliê usadas no cálculo</summary><ul>
   <li>Topo 40%, coração 35%, fundo 25%. Com patchouli ou vetiver no fundo: 45%, 40% e 15%.</li>
   <li>Vela: até 100 ml de essência por kg de cera (10 g para 110 g). Sabonete em barra: 3%. Manteiga: 1% (10 gotas por pote de 50 g). Sabonete líquido: 0,5%.</li>
   <li>1 g ≈ 1 ml ≈ 20 gotas. Abaixo de 2 g, medir com seringa de 1 ou 3 ml sem agulha.</li>
   <li>Essência para vela não vai na pele: sabonete e manteiga usam essência cosmética.</li>
   <li>As fórmulas do círculo são pontos de partida pela família olfativa; o teste decide.</li>
  </ul></details>
  <div>
   <div class="eyebrow">Receitas que já usam ${esc(seed.nome.toLowerCase())}</div>
   ${usam.length?`<div class="chips" style="margin-top:6px">${usam.slice(0,14).map(r=>`<button class="chip" data-act="abrir-receita" data-v="${esc(r.nome)}">${esc(r.nome)}</button>`).join('')}</div>`:`<p class="note">Nenhuma ainda.</p>`}
  </div>
 </section></div>`}

function propCard(p,i,P){
 const rows=['t','c','f'].map(l=>{const n=p.cam[l];if(!n)return `<div class="lay"><b>${LAYN[l]}</b><span class="warn">Sem essência ${p.only?'no estoque':''} para esta camada</span></div>`;
  const tem=emEstoque(n.nome,S.produto);
  return `<div class="lay"><b>${LAYN[l]}</b><span>${esc(n.nome)} ${tem?'<span class="tag-ok">tenho</span>':'<span class="tag-miss">comprar</span>'}<span class="dose num">${dose(p.g[l],P.un)} · ${p.w[l]}%</span></span></div>`}).join('');
 const bar=['t','c','f'].map(l=>p.cam[l]?`<span style="width:${p.w[l]}%;background:${famColor(p.cam[l].f)}" title="${LAYN[l]}"></span>`:'').join('');
 const falt=['t','c','f'].filter(l=>p.cam[l]&&!emEstoque(p.cam[l].nome,S.produto)).length;
 return `<article class="prop" data-act="prop" data-v="${i}" aria-pressed="${S.prop===i}" tabindex="0">
  <div><h3>${esc(p.nome)}</h3><p>${esc(p.desc)}</p></div>
  <div class="bar">${bar}</div><div class="layers">${rows}</div>
  <div class="row" style="gap:6px">
   <button class="btn small" data-act="salvar-prop" data-v="${i}" ${p.falta?'disabled':''}>Salvar como receita a criar</button>
   ${falt?`<button class="btn small ghost" data-act="comprar-prop" data-v="${i}">Faltantes na lista de compras</button>`:''}
  </div></article>`}

function recCard(r){
 const P=PROD[r.produto]||PROD.vela;const w=checar(r);const falta=faltantes(r);const k=r.id;
 const fator=S.escala[k]&&r.baseNum?S.escala[k]/r.baseNum:1;
 const tot=['t','c','f'].reduce((a,l)=>a+somaCamada(r,l),0)||1;
 const bar=camadasDe(r).flatMap(([l,xs])=>xs.map(x=>{const n=noteFor(x[0]);return `<span style="width:${(+x[1]||0)/tot*100}%;background:${n?famColor(n.f):'var(--line)'}" title="${esc(x[0])}"></span>`})).join('');
 const rows=camadasDe(r).filter(([l,xs])=>xs.length).map(([l,xs])=>`<div class="lay"><b>${LAYN[l]}</b><span>${xs.map(x=>{const miss=!r.estudo&&!emEstoque(x[0],r.produto);
   const gg=Math.round((+x[1]||0)*fator*100)/100;
   return `<span style="display:block">${esc(x[0])}${miss?' <span class="tag-miss">comprar</span>':''}<span class="dose num">${gg?dose(gg,P.un):'dose a definir'}</span></span>`}).join('')}</span></div>`).join('');
 const conf=S.confirm===k;
 return `<article class="rc" id="rc-${esc(k)}">
  <div class="top"><div><div class="meta">${esc(P.n)}${r.linha?' · '+esc(r.linha):''}</div><h3>${esc(r.nome)}</h3></div>
   <select class="status" data-act="status" data-id="${esc(k)}" aria-label="Status de ${esc(r.nome)}">${Object.entries(STATUS).map(([s,l])=>`<option value="${s}" ${r.status===s?'selected':''}>${l}</option>`).join('')}</select></div>
  ${r.base?`<div class="meta">Base: ${esc(r.base)}</div>`:''}
  ${tot>1||bar?`<div class="bar">${bar}</div>`:''}
  <div class="layers">${rows||'<span class="muted">Fórmula a montar. Use o Círculo para propor as camadas.</span>'}</div>
  ${r.baseNum?`<label class="f">Escalar para (${P.un==='ml'?'ml':'g'} de base)<input type="number" id="esc-${esc(k)}" data-act="escala" data-id="${esc(k)}" min="1" value="${S.escala[k]||r.baseNum}" style="width:120px"></label>`:''}
  ${w.map(x=>`<div class="warn">${esc(x)}</div>`).join('')}
  ${r.estudo?'<div class="note">Pensada com óleos essenciais: traduzir para essências antes de testar.</div>':''}
  ${(r.historia||r.fonte||r.notas)?`<details><summary>História, fonte e notas</summary>${r.historia?`<p>${esc(r.historia)}</p>`:''}${r.fonte?`<p class="muted">Fonte: ${esc(r.fonte)}</p>`:''}${r.notas?`<p><b>Notas:</b> ${esc(r.notas)}</p>`:''}</details>`:''}
  <details><summary>Preparo e temperaturas</summary><p>${esc(P.prep)}</p></details>
  <div class="acts">
   ${tot>1||rows?`<button class="btn small" data-act="bancada" data-id="${esc(k)}">Na bancada</button>`:''}
   <button class="btn small ghost" data-act="editar" data-id="${esc(k)}">Editar</button>
   <button class="btn small ghost" data-act="testar" data-id="${esc(k)}">Registrar teste</button>
   ${falta.length?`<button class="btn small ghost" data-act="comprar-rec" data-id="${esc(k)}">Faltantes nas compras</button>`:''}
   <button class="btn small ghost" data-act="apagar-rec" data-id="${esc(k)}">${conf?'Confirmar exclusão':'Excluir'}</button>
  </div></article>`}

function vReceitas(){
 const c={};Object.keys(STATUS).forEach(s=>c[s]=S.receitas.filter(r=>r.status===s).length);
 let list=[...S.receitas].sort((a,b)=>(a.ordem??999)-(b.ordem??999)||a.nome.localeCompare(b.nome));
 if(S.fSt!=='todas')list=list.filter(r=>r.status===S.fSt);
 if(S.fPr!=='todos')list=list.filter(r=>r.produto===S.fPr);
 if(S.busca){const q=norm(S.busca);list=list.filter(r=>norm(r.nome+' '+(r.linha||'')+' '+camadasDe(r).map(([l,xs])=>xs.map(x=>x[0]).join(' ')).join(' ')).includes(q))}
 return `${aviso()}<h2>Receitas</h2><p class="lead">Testadas, a testar e a criar. Mude o status direto no cartão; o histórico de cada lote fica no Diário de testes.</p>
 <div class="stats">${Object.entries(STATUS).map(([s,l])=>`<div class="stat"><b class="num">${c[s]}</b><span>${l}</span></div>`).join('')}</div>
 <div class="toolbar">
  <div class="chips">${[['todas','Todas'],...Object.entries(STATUS)].map(([s,l])=>`<button class="chip" data-act="fst" data-v="${s}" aria-pressed="${S.fSt===s}">${l}</button>`).join('')}</div>
  <button class="btn" data-act="nova">Nova receita</button>
 </div>
 <div class="toolbar">
  <div class="chips">${[['todos','Todos os produtos'],...Object.entries(PROD).map(([k,p])=>[k,p.n])].map(([s,l])=>`<button class="chip" data-act="fpr" data-v="${s}" aria-pressed="${S.fPr===s}">${l}</button>`).join('')}</div>
  <input id="in-busca" placeholder="Buscar receita ou essência" value="${esc(S.busca)}" style="flex:1 1 220px;max-width:320px">
 </div>
 ${S.loaded.receitas?(list.length?`<div class="grid">${list.map(recCard).join('')}</div>`:`<div class="empty">${S.receitas.length?'Nenhuma receita neste filtro.':'Nenhuma receita ainda. Para trazer as suas, vá em Estoque › Restaurar cópia e escolha o arquivo atelie-de-aromas-dados.json.'}</div>`):`<div class="empty">Carregando as receitas…</div>`}`}

function vEstoque(){
 const g={};S.estoque.forEach(i=>(g[i.tipo]=g[i.tipo]||[]).push(i));
 return `${aviso()}<h2>Estoque</h2><p class="lead">O que você tem no ateliê. O círculo e as receitas consultam esta lista para marcar “tenho” ou “comprar”. Toque na situação para alternar entre tenho, acabando e acabou.</p>
 <form class="addform" data-form="estoque">
  <label class="f">Item<input id="es-nome" required placeholder="Ex.: Canela"></label>

function autoCompras(){
 const m=new Map();
 S.receitas.filter(r=>['ideia','a-testar','refazer'].includes(r.status)&&!r.estudo).forEach(r=>{
  const P=PROD[r.produto]||PROD.vela;
  camadasDe(r).forEach(([l,xs])=>xs.forEach(x=>{if(emEstoque(x[0],r.produto))return;const k=P.tipos[0]+'|'+keyOf(x[0]);
   if(!m.has(k))m.set(k,{nome:(noteFor(x[0])||{}).nome||x[0],tipo:P.tipos[0],rec:new Set()});m.get(k).rec.add(r.nome)}))});
 return [...m.values()].sort((a,b)=>b.rec.size-a.rec.size||a.nome.localeCompare(b.nome))}

function abrirBancada(id){const r=S.receitas.find(x=>x.id===id);if(!r)return;S.bancada={id,base:S.escala[id]||r.baseNum||null,feitos:{}};renderBancada();travarTela(true)}

function renderBancada(){
 let el=document.getElementById('bancada');if(!el){el=document.createElement('div');el.id='bancada';document.body.appendChild(el)}
 const b=S.bancada;if(!b){el.innerHTML='';document.body.style.overflow='';return}
 const r=S.receitas.find(x=>x.id===b.id);if(!r){fecharBancada();return}
 document.body.style.overflow='hidden';
 const P=PROD[r.produto]||PROD.vela;const fator=b.base&&r.baseNum?b.base/r.baseNum:1;
 const chave=r.produto==='cabelo'?(/condicionador/i.test(r.nome)?'condicionador':'shampoo'):r.produto;
 const passos=PASSOS[chave]||[];
 const ess=camadasDe(r).flatMap(([l,xs])=>xs.map((x,i)=>({l,n:x[0],g:Math.round((+x[1]||0)*fator*100)/100,k:'e'+l+i})));
 const tot=ess.reduce((a,x)=>a+x.g,0);
 const tk=(k,inner)=>`<div class="tick" role="checkbox" tabindex="0" aria-checked="${!!b.feitos[k]}" data-act="tick" data-v="${k}"><span class="bx">${b.feitos[k]?'✓':''}</span>${inner}</div>`;
 el.innerHTML=`<div class="bq" role="dialog" aria-label="Na bancada: ${esc(r.nome)}"><div class="in">
  <div class="hd"><div><div class="eyebrow">${esc(P.n)} · na bancada</div><h2>${esc(r.nome)}</h2></div>

  <div><div class="sec">Essências · pese e marque</div>
   ${ess.map(x=>tk(x.k,`<span class="tx"><span class="lay">${LAYN[x.l]}</span>${esc(x.n)}${x.g?`<small class="num">${fmt(x.g)} ml${x.g<=1.5?` · ${Math.round(x.g*20)} gotas`:''}${x.g<2?' · use a seringa':''}</small>`:''}</span><span class="g">${x.g?fmt(x.g)+' g':'a definir'}</span>`)).join('')}
   ${tot?`<p class="note num" style="margin-top:8px">Total de essência: ${dose(Math.round(tot*100)/100,P.un)}</p>`:''}</div>
  ${passos.length?`<div><div class="sec">Preparo</div>${passos.map((p,i)=>tk('p'+i,`<span class="tx">${esc(p[0])}</span><span class="temp">${esc(p[1])}</span>`)).join('')}</div>`:''}
  ${r.notas?`<div><div class="sec">Notas da ficha</div><p>${esc(r.notas)}</p></div>`:''}

  <p class="note">A tela fica acesa enquanto esta página estiver aberta, quando o celular permite.</p>
 </div></div>`}

function setTab(t){S.tab=t;S.confirm=null;try{history.replaceState(null,'','#'+t)}catch(_){location.hash=t}render();window.scrollTo(0,0)}

function setSeed(nome){const n=noteFor(nome);if(!n)return;S.seed=n.nome;S.seedLayer=null;S.fam=n.f;S.variant=0;S.prop=0;render()}

document.addEventListener('click',async e=>{
 const seg=e.target.closest('path.seg');if(seg){S.fam=+seg.dataset.fam;render();return}
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
 if(['status','escala','qtd','feito'].includes(a))return;
 if(a!=='prop'&&a!=='fechar-fundo')e.stopPropagation();
 if(a==='fechar-fundo'){if(e.target===el){S.edit=null;renderEditor()}return}
 if(a==='seed')return setSeed(v);
 if(a==='prod'){S.produto=v;S.base=PROD[v].base;S.dose=PROD[v].dose;render();return}
 if(a==='variar'){S.variant++;render();return}
 if(a==='prop'){if(e.target.closest('button'))return;S.prop=+v;render();return}
 const props=()=>gerar();
 if(a==='salvar-prop'){const p=props()[+v];const P=PROD[S.produto];
  const cam={};['t','c','f'].forEach(l=>cam[l]=p.cam[l]?[[p.cam[l].nome,p.g[l]]]:[]);
  const nome=`${noteFor(S.seed).nome}, ${p.nome.toLowerCase()}`;
  await salvar(()=>col('receitas').add({nome,produto:S.produto,status:'ideia',linha:'Círculo de aromas',base:`${fmt(S.base)} ${P.un} · essência ${fmt(S.dose)}%`,baseNum:S.base,camadas:cam,criado:hoje(),ordem:900}),'Salva em Receitas, como “A criar”.');return}
 if(a==='comprar-prop'){const p=props()[+v];const nomes=['t','c','f'].map(l=>p.cam[l]).filter(n=>n&&!emEstoque(n.nome,S.produto)).map(n=>n.nome);await addCompras(nomes,S.produto,`Círculo: ${noteFor(S.seed).nome}`);return}
 if(a==='abrir-receita'){S.busca=v;S.fSt='todas';S.fPr='todos';setTab('receitas');return}
 if(a==='fst'){S.fSt=v;render();return} if(a==='fpr'){S.fPr=v;render();return}
 if(a==='nova'){abrirEditor(null);return}
 const rec=id&&S.receitas.find(r=>r.id===id);
 if(a==='bancada'&&rec){abrirBancada(id);return}
 if(a==='fechar-bancada'){fecharBancada();return}
 if(a==='tick'&&S.bancada){S.bancada.feitos[v]=!S.bancada.feitos[v];renderBancada();const t=document.querySelector(`#bancada [data-v="${v}"]`);t&&t.focus();return}
 if(a==='bancada-diario'&&S.bancada){const r=S.receitas.find(x=>x.id===S.bancada.id);const P=PROD[r.produto]||PROD.vela;
  S.diarioPre={receita:r.nome,base:S.bancada.base?`${fmt(S.bancada.base)} ${P.un}`:(r.base||''),data:hoje()};fecharBancada();setTab('diario');return}
 if(a==='editar'&&rec){abrirEditor(rec);return}
 if(a==='testar'&&rec){S.diarioPre={receita:rec.nome,base:rec.base||'',data:hoje()};setTab('diario');return}
 if(a==='comprar-rec'&&rec){await addCompras(faltantes(rec),rec.produto,rec.nome);return}
 if(a==='apagar-rec'&&rec){if(S.confirm!==id){S.confirm=id;render();return}S.confirm=null;await salvar(()=>col('receitas').doc(id).delete(),'Receita excluída.');return}
 if(a==='sit'){const it=S.estoque.find(i=>i.id===id);const nx={tenho:'acabando',acabando:'acabou',acabou:'tenho'}[it.situacao||'tenho'];await salvar(()=>col('estoque').doc(id).update({situacao:nx}));return}
 if(a==='apagar-est'){if(S.confirm!==id){S.confirm=id;render();return}S.confirm=null;await salvar(()=>col('estoque').doc(id).delete(),'Removido do estoque.');return}
 if(a==='comprei'){await salvar(()=>col('estoque').add({nome:v,tipo:el.dataset.t,fornecedor:'',qtd:'',situacao:'tenho',obs:'Comprado em '+hoje().split('-').reverse().join('/')}),`${v} foi para o estoque.`);return}
 if(a==='reposto'){await salvar(()=>col('estoque').doc(id).update({situacao:'tenho'}),'Atualizado no estoque.');return}
 if(a==='paraestoque'){const c=S.compras.find(i=>i.id===id);if(!c)return;await salvar(async()=>{await col('estoque').add({nome:c.nome,tipo:c.tipo||'insumo',fornecedor:c.obs||'',qtd:'',situacao:'tenho'});await col('compras').doc(id).delete()},`${c.nome} foi para o estoque.`);return}
 if(a==='apagar-comp'){if(S.confirm!==id){S.confirm=id;render();return}S.confirm=null;await salvar(()=>col('compras').doc(id).delete());return}

 if(a==='ed-add'){lerEditor();S.edit.camadas[el.dataset.l].push(['',0]);renderEditor();return}
 if(a==='ed-rm'){lerEditor();S.edit.camadas[el.dataset.l].splice(+el.dataset.i,1);if(!S.edit.camadas[el.dataset.l].length)S.edit.camadas[el.dataset.l].push(['',0]);renderEditor();return}
 if(a==='fechar'){S.edit=null;renderEditor();return}
});

 const novos=[...new Set(nomes)].filter(n=>!ex.has(keyOf(n)));
 if(!novos.length){toast('Esses itens já estão na lista avulsa.');return}
 await salvar(async()=>{for(const n of novos)await col('compras').add({nome:n,tipo,obs:`${TIPOS[tipo]} · ${motivo}`,feito:false})},`${novos.length} item${novos.length>1?'s':''} na lista de compras.`)}

 if(t.dataset.act==='escala'){const x=+t.value;if(x>0){S.escala[t.dataset.id]=x;clearTimeout(tm.e);tm.e=setTimeout(render,300)}return}

 if(t.id==='in-layer'){S.seedLayer=t.value;render();return}
 if(t.id==='in-seed'){const n=noteFor(t.value);if(n)setSeed(n.nome);else toast('Essência fora do círculo. Escolha uma da lista.');return}

 if(t.dataset.act==='qtd'){await salvar(()=>col('estoque').doc(t.dataset.id).update({qtd:t.value.trim()}),'Quantidade salva.');return}
 if(t.dataset.act==='feito'){await salvar(()=>col('compras').doc(t.dataset.id).update({feito:t.checked}));return}
});
document.addEventListener('submit',async e=>{const f=e.target;e.preventDefault();const v=id=>(document.getElementById(id)?.value||'').trim();
 const k=f.dataset.form;
 if(k==='estoque'){if(!v('es-nome'))return;if(await salvar(()=>col('estoque').add({nome:v('es-nome'),tipo:v('es-tipo'),fornecedor:v('es-forn'),qtd:v('es-qtd'),situacao:'tenho'}),'Adicionado ao estoque.'))f.reset();return}
 if(k==='compra'){if(!v('co-nome'))return;if(await salvar(()=>col('compras').add({nome:v('co-nome'),obs:v('co-obs'),tipo:'insumo',feito:false}),'Adicionado à lista.'))f.reset();return}
 if(k==='diario'){if(!v('di-rec'))return;if(await salvar(()=>col('diario').add({data:v('di-data'),receita:v('di-rec'),pote:v('di-pote'),base:v('di-base'),essencia:v('di-ess'),frio:+v('di-frio')||null,quente:+v('di-quente')||null,mudar:v('di-mudar')}),'Teste registrado.')){S.diarioPre=null;f.reset();render()}return}
 if(k==='receita'){lerEditor();const r=S.edit;if(!r.nome){toast('Dê um nome à receita.');return}
  ['t','c','f'].forEach(l=>r.camadas[l]=r.camadas[l].filter(x=>x[0]));
  const {id,...data}=r;data.atualizado=hoje();
  const ok=await salvar(()=>id?col('receitas').doc(id).set(data):col('receitas').add({...data,ordem:data.ordem??900}),'Receita salva.');
  if(ok){S.edit=null;renderEditor()}}
});

{const h=location.hash.slice(1);if(['circulo','receitas','estoque','compras','diario'].includes(h))S.tab=h}

const LS_KEY='atelie-aromas-dados-v1';
function makeLocalDB(seed){
 let data=null;try{data=JSON.parse(localStorage.getItem(LS_KEY))}catch(_){}
 if(!data||typeof data!=='object'){data=JSON.parse(JSON.stringify(seed));save()}
 const subs={};
 function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){toast('Não foi possível gravar no celular. Salve uma cópia de segurança.')}}
 function snap(c){const docs=Object.entries(data[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}));return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}}}
 function emit(c){(subs[c]||[]).forEach(fn=>fn(snap(c)))}
 const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
 return {
  all:()=>JSON.parse(JSON.stringify(data)),
  replace(d){data=d;save();Object.keys(subs).forEach(emit)},
  collection(c){return {
   onSnapshot(fn){(subs[c]=subs[c]||[]).push(fn);setTimeout(()=>fn(snap(c)),0);return()=>{}},
   async add(d){data[c]=data[c]||{};const id=uid();data[c][id]=d;save();emit(c);return {id}},
   doc(id){return {
    async set(d){data[c]=data[c]||{};data[c][id]=d;save();emit(c)},
    async update(d){data[c]=data[c]||{};data[c][id]={...(data[c][id]||{}),...d};save();emit(c)},
    async delete(){if(data[c])delete data[c][id];save();emit(c)}}}}}
 };
}
S.db=makeLocalDB(SEED);S.ok=true;S.tried=true;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
['receitas','estoque','compras','diario'].forEach(c=>S.db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[c]=true;render()}));

/* ---------- Cópia de segurança ---------- */
async function salvarCopia(){
 const txt=JSON.stringify({app:'atelie-de-aromas',versao:1,data:new Date().toISOString(),dados:S.db.all()},null,1);
 const nome=`atelie-de-aromas-${hoje()}.json`;
 try{const file=new File([txt],nome,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Cópia do Ateliê de Aromas'});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
 toast('Cópia salva.')}
let copiaPendente=null;
document.addEventListener('change',e=>{if(e.target.id!=='in-copia')return;const f=e.target.files&&e.target.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const d=j.dados||j;if(!d.receitas)throw 0;copiaPendente=d;
  const n=Object.keys(d.receitas||{}).length;document.getElementById('copia-msg').innerHTML=`Cópia com ${n} receitas. Ela substitui tudo o que está no app agora. <button class="btn small" data-act="copia-confirmar">Restaurar</button> <button class="btn small ghost" data-act="copia-cancelar">Cancelar</button>`}
  catch(_){toast('Esse arquivo não é uma cópia do Ateliê.')}};rd.readAsText(f)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='copia-salvar')salvarCopia();
 if(b.dataset.act==='copia-confirmar'&&copiaPendente){S.db.replace(copiaPendente);copiaPendente=null;toast('Dados restaurados.')}
 if(b.dataset.act==='copia-cancelar'){copiaPendente=null;render()}});

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}

</script>
